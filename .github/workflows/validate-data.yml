name: Validate data.json

on:
  push:
    paths:
      - "data.json"
      - ".github/scripts/validate_data.py"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data.json"
      - ".github/scripts/validate_data.py"
      - ".github/workflows/validate-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data.json structure
        run: python3 .github/scripts/validate_data.py
